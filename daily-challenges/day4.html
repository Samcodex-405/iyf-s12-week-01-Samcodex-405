<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - My Photo Gallery</title>
</head>
<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of my favourite pictures.</p>
    </header>

    <main>
        <section>
            <h2>My Gallery</h2>

            <figure>
                <img src="../images/my-photo.jpg"
                     alt="My profile photo"
                     width="250">
                <figcaption>My Profile Picture</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/250x180"
                     alt="A sample nature picture"
                     width="250">
                <figcaption>Beautiful Nature</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/250x180"
                     alt="A sample technology picture"
                     width="250">
                <figcaption>Technology and Learning</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
