<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Navigation Menu</title>
</head>
<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my website!</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This is where visitors learn about me.</p>
        </section>

        <section id="services">
            <h2>Services</h2>
            <p>Here are the services I offer.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>You can contact me here.</p>
        </section>
    </main>

</body>
</html>
